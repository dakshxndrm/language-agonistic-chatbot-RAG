[project]
name = "bhasha"
version = "0.1.0"
description = "Self-hostable real-time speech-to-speech agent for Indian history Q&A"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "requests>=2.32",
    "tqdm>=4.66",
    "tiktoken>=0.8",
]

[project.optional-dependencies]
# Installed per milestone so `pip install -e .` stays fast on a laptop.
rag = ["sentence-transformers>=3.3", "asyncpg>=0.30", "pgvector>=0.3", "cohere>=5.11"]
graph = ["neo4j>=5.25"]
voice = ["pipecat-ai>=1.0", "livekit-agents>=0.12", "livekit-api>=0.8",
        "faster-whisper>=1.1", "fasttext-wheel>=0.9", "kokoro>=0.9"]
dev = ["ruff>=0.8", "pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
include = ["server*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["web", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# build_corpus.py is DONE and tested (CLAUDE.md section 6) - lint it, don't restyle it.
"scripts/build_corpus.py" = ["UP035", "UP017", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
